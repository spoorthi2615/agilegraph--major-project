version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agilegraph-backend
    entrypoint: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - AGILEGRAPH_ALLOW_ANONYMOUS=true
      - PYTHONPATH=/app
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: agilegraph-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx -y serve -s dist -l 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
